project:
  type: website
  post-render: _social/make-card.R   # builds _site/images/social-preview.png
  
website:
  favicon: images/favicon.png
  site-url: https://tidy-survey-r.github.io/site/
  description: "Exploring Complex Survey Data Analysis Using R: a tidy introduction with {srvyr} and {survey}."
  image: images/social-preview.png   # link-preview image, generated by _social/make-card.R
  open-graph:
    site-name: "Tidy Survey Analysis in R"
  twitter-card:
    card-style: summary_large_image
  search: false
  navbar:
    pinned: true
    background: $brand-blue
    left:
      - text: "Tidy Survey Analysis in R"
        href: index.qmd
    right:
      - text: "Home"
        menu:
          - text: "About the Book"
            href: index.qmd#about-book
          - text: "Get the Book"
            href: index.qmd#buy-book
          - text: "Companion Data Package"
            href: index.qmd#data-pkg
          - text: "About the Authors"
            href: index.qmd#authors
      - text: "Events"
        href: events.qmd
      - text: "<button class='nav-btn'>Read the book →</button>"
        href: https://tidy-survey-r.github.io/tidy-survey-book/
        target: _blank
  page-footer: TIDY SURVEY ANALYSIS IN R © 2024-2026. CC-BY-NC-ND 4.0.

editor: source

format:
  html:
    page-layout: full
    theme: brand
    css: styles.css

execute:
  echo: true
  freeze: auto

highlight-style: atom-one

quarto-required: ">= 1.10.20"

# atom-one
# github
# solarized
